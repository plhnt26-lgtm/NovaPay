<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaPay | Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1 class="logo">
        Nova<span>Pay</span>
    </h1>

    <p class="subtitle">
        Dashboard
    </p>

    <div class="card">

        <h2>
            Welcome,
            <span id="userName">Loading...</span>
        </h2>

        <div class="mt20">

            <p>Total Balance</p>

            <h1 id="balance">$0.00</h1>

        </div>

        <button
        class="btn mt20"
        onclick="location.href='deposit.html'">

        Deposit

        </button>

        <button
        class="btn mt20"
        onclick="location.href='withdraw.html'">

        Withdraw

        </button>

        <button
        class="btn mt20"
        onclick="location.href='profile.html'">

        Profile

        </button>

        <button
        class="btn mt20"
        onclick="logout()">

        Logout

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>
</html>
